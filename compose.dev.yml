name: bonfire-dev

services:
  redis:
    image: redis:8-alpine
    container_name: bonfire-dev-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6321:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 10
