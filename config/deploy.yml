service: <%= ENV.fetch("KAMAL_SERVICE", "bonfire") %>
image: <%= ENV.fetch("KAMAL_IMAGE", "bonfire") %>
deploy_timeout: 120

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_SERVER", ENV.fetch("DEPLOY_HOST")) %>

proxy:
  ssl: <%= ENV.fetch("DEPLOY_PROXY_SSL", "true") == "true" %>
  host: <%= ENV.fetch("DEPLOY_HOST") %>
  app_port: 80

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY", "localhost:5555") %>

env:
  clear:
    RAILS_ENV: production
    DISABLE_SSL: true
    EMAIL_NOTIFICATIONS_ENABLED: <%= ENV.fetch("EMAIL_NOTIFICATIONS_ENABLED", "false") %>
    EMAIL_PROVIDER: <%= ENV.fetch("EMAIL_PROVIDER", "postmark") %>
    EMAIL_FROM: <%= ENV.fetch("EMAIL_FROM", "Bonfire <notifications@localhost>") %>
    MAILER_HOST: <%= ENV.fetch("MAILER_HOST", ENV.fetch("DEPLOY_HOST")) %>
    MAILER_PROTOCOL: <%= ENV.fetch("MAILER_PROTOCOL", "https") %>
    POSTMARK_MESSAGE_STREAM: <%= ENV.fetch("POSTMARK_MESSAGE_STREAM", "outbound") %>
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "localhost") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    SMTP_AUTHENTICATION: <%= ENV.fetch("SMTP_AUTHENTICATION", "plain") %>
    SMTP_STARTTLS: <%= ENV.fetch("SMTP_STARTTLS", "true") %>
    RTMP_HOMEBREW_DIRECT_PLAYER: <%= ENV.fetch("RTMP_HOMEBREW_DIRECT_PLAYER", "true") %>
  secret:
    - SECRET_KEY_BASE
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - RTMP_HOMEBREW_PRIVATE_KEY
    - RTMP_HOMEBREW_KEY_ID
    - RTMP_HOMEBREW_ISSUER
    - RTMP_HOMEBREW_AUDIENCE
    - RTMP_HOMEBREW_ALLOWED_PLAYER_ORIGINS
    - RTMP_HOMEBREW_EVENT_SECRET
<% if ENV["EMAIL_NOTIFICATIONS_ENABLED"] == "true" %>
<% if ENV.fetch("EMAIL_PROVIDER", "postmark") == "postmark" %>
    - POSTMARK_SERVER_TOKEN
<% else %>
    - SMTP_USERNAME
    - SMTP_PASSWORD
<% end %>
<% end %>

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "root") %>

builder:
  arch: <%= ENV.fetch("KAMAL_BUILDER_ARCH", "amd64") %>

volumes:
  - <%= ENV.fetch("DEPLOY_STORAGE_PATH", "/var/lib/kamal/bonfire/storage") %>:/rails/storage

asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
